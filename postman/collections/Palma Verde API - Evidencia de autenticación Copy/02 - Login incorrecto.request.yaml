$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin",
      "password": "Incorrecta"
    }
scripts:
  - type: afterResponse
    code: pm.test('Credenciales incorrectas devuelven 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
